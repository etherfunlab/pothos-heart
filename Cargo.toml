[package]
name = "pothos-heart"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/etherfunlab/pothos-heart"
description = "Open-source matchmaking engine: explainable candidate ranking from companion-derived profiles."
publish = false

[[bin]]
name = "pothos-heart"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
toml = "0.8"
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
