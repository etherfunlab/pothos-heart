# Soft-score weights. Overlap coefficient per array dimension, geo by level;
# the weighted sum is divided by the weight total, so score ∈ [0, 1].
# Starting values — tune against real reads, not against this week's users.
[weights]
interests = 0.5
personality_traits = 0.3
geo = 0.2

# Credit for the finest matching geo level, each between 0 and 1. Country must
# match for any credit; a city counts only when the regions don't contradict it.
[geo]
city = 1.0
region = 0.6
country = 0.3

# Concept step: the language new concept labels are written in. Existing
# labels are reused whatever language a phrase is in.
[concepts]
label_language = "en"
